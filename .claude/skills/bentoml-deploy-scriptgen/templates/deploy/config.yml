# =============================================================================
# config.yml — the ONE file you edit in this bundle.
#
# Generated by the bentoml-deploy-scriptgen skill. `deploy.py` and everything
# under `_internal/` are static, reviewed artifacts — never edit those. Every
# tunable lives here: build target, image, cluster, the per-service workload
# shape (replicas/resources/probes/env/exposure/autoscaling), and the
# post-deploy verification.
#
# The Kubernetes manifests are RENDERED FROM THIS FILE on every run and piped
# straight to `kubectl apply` — there are no hand-owned YAML files to keep in
# sync. To see exactly what would be applied:
#
#     python3 deploy/deploy.py --target k8s --render-only          # -> deploy/rendered/
#     python3 deploy/deploy.py --target k8s --check-only --local-only
#     python3 deploy/deploy.py --target k8s                        # build+push+deploy+verify
#
# Requires PyYAML (`pip install pyyaml`; the `bentoml` package already depends
# on it, so any machine that can build is fine — a deploy-only CI job that does
# not install bentoml must install pyyaml).
#
# Anything this file cannot express: see `kubernetes.manifests_dir` (the escape
# hatch) and `services.<Name>.config_overrides` (runtime BentoML retuning).
# =============================================================================

# Config schema version. v1/v2 were `deploy.config.json`; they are rejected
# with instructions rather than migrated, because the manifest model changed.
schema: bentoml-deploy-config/v3

project:
  # Where the BentoML project lives, relative to THIS FILE (this bundle keeps
  # config.yml in deploy/, so ".." is the project root).
  dir: ..
  # `bentoml build` target as `module:Class`, e.g. service:Gateway. Leave null
  # when `bentoml build` finds the service on its own; required when service.py
  # defines several services.
  service: null
  # Bento name. Informational here: it names the ec2 container and the
  # `app.kubernetes.io/part-of` label on every rendered object.
  name: "{{SERVICE_NAME}}"

image:
  # Registry host, e.g. 123456789012.dkr.ecr.us-west-1.amazonaws.com, ghcr.io,
  # docker.io. Use "" for a local-only image (with registry_type: none).
  registry: "{{IMAGE_REGISTRY}}"
  # Repository/name inside the registry, e.g. acme/text-suite. Lowercase.
  repository: "{{IMAGE_REPOSITORY}}"
  # ecr     — `aws ecr get-login-password` login + describe-or-create the repo
  # generic — you keep `docker login` valid yourself
  # none    — nothing is pushed (kind/minikube `image load`); then
  #           local_image_preloaded MUST be true
  registry_type: "{{REGISTRY_TYPE}}"
  # Set "linux/amd64" when the cluster nodes are amd64 and builds may run on
  # arm64 (Apple silicon). null = build for the host architecture.
  platform: null
  # ECR region. Derived from the registry host when null; set it explicitly if
  # the host is not a standard ECR hostname.
  ecr_region: null
  # registry_type: none only — your acknowledgement that the image is already
  # loaded onto the cluster nodes. Without it preflight fails fast instead of
  # letting the rollout die in ImagePullBackOff.
  local_image_preloaded: false

kubernetes:
  # kubectl context name (from `kubectl config get-contexts`). Never implicit:
  # every kubectl call this script makes passes --context explicitly.
  context: "{{K8S_CONTEXT}}"
  # Target namespace. It must already exist — this script never creates
  # namespaces and never renders a Namespace object:
  #   kubectl --context <ctx> create namespace <ns>
  namespace: "{{NAMESPACE}}"
  # Name of an existing imagePullSecret, when the cluster cannot pull the image
  # natively (EKS -> ECR usually can). null = no imagePullSecrets in the pods.
  image_pull_secret: null
  # Per-Deployment `kubectl rollout status` budget. Keep it LARGER than the
  # startup budget a pod may legitimately use (probes.startup_failure_threshold
  # x 10s), or a pod that just makes it loses the race and the run reports a
  # failure at the moment it succeeded.
  rollout_timeout_seconds: 900
  # Local port for the verification port-forward. verify also uses
  # local_port + 1 to scrape each dependency's /metrics, so keep both free.
  local_port: 3130
  # Extra labels merged onto EVERY rendered object (team, cost-center, ...).
  # Values must be quoted strings. The app.kubernetes.io/* labels are managed
  # by the renderer and win over anything set here.
  extra_labels: {}
  # ESCAPE HATCH — leave null unless you have outgrown this config.
  # When set (a path relative to this file, e.g. "k8s"), rendering is SKIPPED
  # and every *.yaml/*.yml in that directory is applied VERBATIM instead —
  # image reference included, nothing is substituted. You then own that YAML:
  # the `services:` blocks below still drive rollout order, verification and
  # the dependency-wiring checks, but no longer the workload shape, and each
  # build means re-rendering or editing the tag yourself.
  # This is where the knobs this file deliberately does NOT have live:
  # path_prefix probe paths, terminationGracePeriodSeconds, liveness timings,
  # imagePullPolicy, revisionHistoryLimit, HPA behavior windows,
  # affinity/topologySpreadConstraints, volumes, sidecars, PodDisruptionBudgets.
  # Migration path: `deploy.py --target k8s --render-only DIR`, commit DIR,
  # then point this key at it. To re-render later you must UNSET this key again
  # (--render-only refuses while it is set), render, then set it back and
  # re-apply your own edits — so keep those edits small.
  manifests_dir: null

# One block per BentoML service in the bento — the KEY IS THE BentoML SERVICE
# NAME EXACTLY as the bento declares it (dependency lookup and --service-name
# both key on it). Each block becomes one Deployment + one Service (+ an
# optional HPA, + an optional Ingress on the entry service).
#
# DERIVED for you — never maintained by hand:
#   * rollout order: a topological sort of `depends` (deepest dependencies
#     first, alphabetical within a tier), because a caller's /readyz fans out
#     to its dependencies and 503s until they answer;
#   * BENTOML_SERVE_DEPENDS on every service with a non-empty `depends`, as
#     `Name=http://<slug>.<namespace>.svc.cluster.local:3000` pairs;
#   * labels and selectors, from each service's slug.
#
# The example below is a two-service shape (one entry + one dependency). ADD
# ONE BLOCK PER EXTRA SERVICE by copying a block and changing its key, its
# `depends`, and its resources — for a middle tier, list its own dependencies
# in its own `depends` (it gets its own BENTOML_SERVE_DEPENDS). For a
# single-service bento, delete the dependency block and the entry service's
# `depends` list. Every key except `entry` is optional; the defaults below are
# the shipped defaults.
services:
  "{{DEP_SERVICE_NAME}}":
    # Exactly one service in this file may be the entry service.
    entry: false
    # Kubernetes object name for this service (Deployment, Service, HPA) and
    # its in-cluster hostname. Optional: defaults to the service name
    # snake_cased with "_" -> "-". Must be a DNS-1035 label
    # (^[a-z]([-a-z0-9]*[a-z0-9])?$) and unique across services.
    # slug: dep-service
    # BentoML service names this one calls directly (its `bentoml.depends()`
    # targets). Leaves list nothing.
    depends: []
    # Fixed pod count. IGNORED (and omitted from the Deployment) when
    # autoscaling.enabled is true, because a declared replica count and an HPA
    # fight each other on every apply.
    replicas: 1
    # requests = what the scheduler reserves and what a CPU-utilization HPA is
    # measured against; limits = the hard ceiling (CPU throttles, memory
    # OOMKills). ALWAYS set all four: @bentoml.service(resources={"cpu",
    # "memory"}) is INERT in open-source BentoML, so without these nothing
    # constrains the pod.
    # QUOTE EVERY QUANTITY, including whole numbers: cpu: 1 is a YAML int and
    # is rejected here (Kubernetes stores the quantity as the string "1", so an
    # int makes every `kubectl apply` report "configured" forever and makes
    # `kubectl diff` / GitOps drift detection lie).
    resources:
      requests: {cpu: "100m", memory: "256Mi"}
      # GPUs go here as limits only, integer, e.g.  nvidia.com/gpu: "1"
      # (requires the NVIDIA device plugin; GPUs are never shared between pods).
      limits: {cpu: "1", memory: "1Gi"}
    # Plain, NON-SECRET environment variables for this service's container.
    # Values must be quoted strings.
    env: {}
    # Names of existing Secrets in this namespace, mounted as envFrom/secretRef
    # (tokens, API keys), e.g. ["hf-token"]. Create them beforehand:
    #   kubectl --context <ctx> create secret generic hf-token -n <ns> \
    #       --from-literal=HF_TOKEN=...
    # Keep them to credentials: NOTHING here or in preflight can see inside a
    # Secret, so a BENTOML_RUNNER_MAP (or BENTOML_SERVE_DEPENDS) key in one
    # silently overrides the dependency wiring in the pod — the in-process trap
    # described under `depends`, with no warning anywhere.
    env_from_secrets: []
    # Runtime BentoML retuning with NO image rebuild. Write BARE keys for THIS
    # service — the renderer nests them under
    # {"services": {"<ThisServiceName>": ...}} and emits that as
    # BENTOML_CONFIG_OVERRIDES (compact JSON). The nesting is load-bearing: a
    # global services.<key> block is merged UNDER the @bentoml.service(...)
    # decorator and loses, while the per-service form beats it. Example:
    #   config_overrides: {workers: 2, traffic: {timeout: 120}}
    # TIMEOUT TRAP, and its workaround: the client deadline for a call to a
    # dependency is read from the CALLER's own config, keyed by the CALLEE's
    # name — which this per-service block cannot express. Either raise the
    # timeout in the callee's @bentoml.service decorator (that config is
    # registered in every pod of the bento), or set the full JSON yourself as
    # env: {BENTOML_CONFIG_OVERRIDES: '{"services":{"Callee":{...}}}'} on the
    # caller and leave its config_overrides empty — a BENTOML_CONFIG_OVERRIDES
    # you set in `env` is passed through verbatim and nothing is derived.
    config_overrides: {}
    # Pin this service to particular nodes (GPU pool, arch, zone). Values must
    # be quoted strings, e.g. {"nvidia.com/gpu.present": "true"}.
    node_selector: {}
    # Tolerations for tainted pools, verbatim Kubernetes objects, e.g.
    #   - {key: "nvidia.com/gpu", operator: "Exists", effect: "NoSchedule"}
    tolerations: []
    probes:
      # startupProbe budget = this x periodSeconds 10. 60 -> 10 minutes of
      # model loading; raise it for big models (and keep
      # kubernetes.rollout_timeout_seconds above it).
      startup_failure_threshold: 60
      # timeoutSeconds for /readyz on the startup and readiness probes.
      # 6 IS A FLOOR, not a preference: when BentoML fans /readyz out to a
      # dependency it gives that dependency a HARD-CODED 5s budget, so /readyz
      # can legitimately take just over 5s. A lower timeout makes the kubelet
      # hang up first and the pod stays permanently unready. The 5s is a
      # framework constant (runner_probe.timeout is inert on BentoML 1.2+).
      # Raise it for deep dependency chains; never lower it.
      readiness_timeout_seconds: 6
    autoscaling:
      # true renders an HPA for this service and omits spec.replicas.
      enabled: false
      min_replicas: 1
      max_replicas: 5
      # cpu         — Resource/cpu averageUtilization (stock metrics-server;
      #               works only because requests.cpu is always set). A poor
      #               proxy for GPU inference: a busy GPU pod can sit at 5% CPU.
      # concurrency — Pods metric on bentoml_service_request_in_progress
      #               (in-flight requests per pod); needs a custom-metrics
      #               adapter that exposes it.
      metric: cpu
      # % of requested CPU for metric: cpu; in-flight requests per pod for
      # metric: concurrency.
      target: 70

  "{{ENTRY_SERVICE_NAME}}":
    # The entry service: the bento's entry_service, the only one that speaks
    # ordinary JSON HTTP, the only one that may be exposed, and the only one
    # verification talks to.
    entry: true
    depends: ["{{DEP_SERVICE_NAME}}"]
    replicas: 1
    resources:
      requests: {cpu: "100m", memory: "256Mi"}
      limits: {cpu: "1", memory: "1Gi"}
    env: {}
    env_from_secrets: []
    config_overrides: {}
    node_selector: {}
    tolerations: []
    probes:
      startup_failure_threshold: 60
      readiness_timeout_seconds: 6
    autoscaling:
      enabled: false
      min_replicas: 1
      max_replicas: 5
      metric: cpu
      target: 70
    # ENTRY SERVICE ONLY. Non-entry Services are always ClusterIP and this key
    # is rejected on them: inter-service payloads are unauthenticated
    # `application/vnd.bentoml+pickle`, so publishing a dependency's port hands
    # anyone who can reach it code execution in that pod.
    expose:
      # ClusterIP (reach it with `kubectl port-forward`) | NodePort | LoadBalancer
      type: ClusterIP
      # NodePort/LoadBalancer only: pin the node port (30000-32767) for a
      # stable URL. null lets the cluster allocate (and `kubectl apply`
      # preserves the existing allocation).
      node_port: null
      # Cloud load-balancer annotations for the Service (internal LB, idle
      # timeout, NLB vs ALB, ...). Quoted string values.
      annotations: {}
    # ENTRY SERVICE ONLY, optional. Requires an ingress controller in the
    # cluster (`kubectl --context <ctx> get ingressclass`).
    ingress:
      enabled: false
      class_name: nginx
      # Required when enabled: the DNS name that resolves to the controller.
      host: ""
      # Existing TLS Secret in this namespace for HTTPS; null = plain HTTP.
      tls_secret: null
      # Controller annotations — inference usually needs a raised proxy timeout
      # (nginx defaults to 60s) and a body-size limit that fits the payload.
      annotations: {}

verify:
  # How long to wait for the entry service's /readyz to return 200 through the
  # port-forward, after all rollouts are complete.
  readyz_timeout_seconds: 600
  # Multi-service bentos: sample each dependency's own
  # bentoml_service_request_total around the inference request and FAIL unless
  # it moved. This is the only signal that distinguishes a working split from a
  # gateway that silently instantiated its dependencies IN-PROCESS — that
  # failure mode answers correctly and reports ready while the dependency pods
  # idle. Set false only when a dependency is deliberately not on the smoke
  # test's code path.
  dependency_metrics: true
  # Post-deploy smoke test against the ENTRY service. Set `inference: null` to
  # skip it (then nothing proves the service can actually answer).
  inference:
    # An @bentoml.api route on the entry service, e.g. /analyze.
    path: "{{INFERENCE_PATH}}"
    # The request body, as native YAML (not a JSON string). Replace the whole
    # mapping with what your API expects.
    body:
      text: "{{INFERENCE_BODY_TEXT}}"
    # Substring the response must contain. null = only the HTTP status is
    # checked.
    expect_substring: "{{EXPECT_SUBSTRING}}"
    timeout_seconds: 60

# EC2 target — plain Docker on EXISTING instances (this script never
# provisions EC2). Delete this whole section for a Kubernetes-only bundle.
ec2:
  # Public IPs/DNS names of existing, SSH-reachable instances. Bare hosts, no
  # "user@". Deployed and verified sequentially, fail-fast.
  hosts: ["{{EC2_HOST}}"]
  # ec2-user (Amazon Linux) or ubuntu (Ubuntu).
  ssh_user: "{{EC2_SSH_USER}}"
  # Private key path ("~" expands; relative paths resolve against deploy/).
  # Point at where the key already lives — never copy a key into the repo.
  # Preflight enforces mode 600.
  ssh_key_path: "{{EC2_SSH_KEY_PATH}}"
  # Container that `docker rm -f` + `docker run` replaces on every deploy.
  container_name: "{{SERVICE_NAME}}"
  # Published as -p <host_port>:3000.
  host_port: 3000
  # Runtime env var NAMES only, e.g. ["HF_TOKEN"]. Values are read from the
  # deploying process's environment at deploy time, travel base64 over the SSH
  # channel's stdin, and are never written anywhere.
  env_names: []
  # ecr-token-over-ssh — mint a fresh ECR token locally and pipe it to each
  #                      host (never touches instance IAM)
  # preauthed          — the instances can already pull (instance profile, a
  #                      docker login you maintain, or a public image)
  registry_auth: "{{EC2_REGISTRY_AUTH}}"
  # tunnel — verify over a hardened SSH tunnel (works with no inbound rule)
  # direct — plain HTTP to <host>:<host_port> (needs a security-group rule)
  verify_via: tunnel
  # Local port for the tunnel verify; change it if 3230 is taken.
  local_tunnel_port: 3230
